name: Build MixPilot AI 5 - Windows VST3
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Find project and configure
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Filter CMakeLists.txt -Recurse -File | Where-Object { $_.FullName -notmatch '[\\/]build[\\/]' } | Select-Object -First 1
          if (-not $project) { throw 'Could not find CMakeLists.txt' }
          cmake -S $project.DirectoryName -B build -G "Visual Studio 17 2022" -A x64
      - name: Compile VST3
        run: cmake --build build --config Release --target MixPilotAI5_VST3 --parallel 2
      - name: Upload Windows plugin
        uses: actions/upload-artifact@v4
        with:
          name: MixPilot-AI5-Windows-VST3
          path: build/MixPilotAI5_artefacts/Release/VST3/
          if-no-files-found: error
